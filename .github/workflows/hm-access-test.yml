name: H&M stock monitor

# Run once each hour, or start one round manually from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

# Needed to save state.json on this repository's monitor-state branch.
permissions:
  contents: write

# Use the original group's name so old tests and live runs cannot overlap.
concurrency:
  group: hm-access-test
  cancel-in-progress: false

jobs:
  monitor:
    name: Check H&M and send alerts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Download repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-browser.txt

      - name: Check Telegram settings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re

          required = {
              "TELEGRAM_BOT_TOKEN": r"\d+:[A-Za-z0-9_-]+",
              "TELEGRAM_CHAT_ID": r"-?\d+",
          }
          for name, pattern in required.items():
              if not re.fullmatch(pattern, os.environ.get(name, "").strip()):
                  raise SystemExit(
                      f"Add a valid {name} repository secret. Paste only its value, without quotes."
                  )
          print("Telegram settings are present; their values are not displayed.")
          PY

      - name: Restore notification history
        id: state
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/hm-state"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Distinguish an absent branch from a network or permissions failure.
          if git ls-remote --exit-code --heads origin refs/heads/monitor-state > "$RUNNER_TEMP/hm-state-ref.txt"; then
            git fetch --no-tags --depth=1 origin refs/heads/monitor-state
            git worktree add --detach "$state_dir" FETCH_HEAD
            echo "Restored notification history from monitor-state."
          else
            lookup_status=$?
            if [ "$lookup_status" -ne 2 ]; then
              echo "Could not read the state branch. Stopping rather than resetting alert history."
              exit "$lookup_status"
            fi

            # First run: create an independent branch containing only state.json.
            git worktree add --detach "$state_dir" HEAD
            git -C "$state_dir" switch --orphan hm-state-initial
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "hm-state" / "state.json"
          path.write_text(json.dumps({"watches": {}}, indent=2) + "\n", encoding="utf-8")
          PY
            git -C "$state_dir" add -- state.json
            git -C "$state_dir" commit -m "Initialize H&M notification history"
            state_commit=$(git -C "$state_dir" rev-parse HEAD)

            # Push from the original checkout, where GitHub authentication is set up.
            git push origin "$state_commit:refs/heads/monitor-state"
            echo "Created monitor-state for future runs."
          fi

          # A damaged existing file must not silently become a fresh baseline.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "hm-state" / "state.json"
          state = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(state, dict) or not isinstance(state.get("watches"), dict):
              raise SystemExit("Saved state is invalid. No H&M checks or alerts were started.")
          print("Saved state is ready.")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-browser.txt

      - name: Check H&M with connected Chrome
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          google-chrome --version

          # Use the runner's virtual display for an ordinary Chrome process.
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24 -nolisten tcp" bash -euo pipefail <<'BASH'
          google-chrome \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/hm-chrome-profile" \
            --no-first-run \
            --no-default-browser-check \
            --window-size=1280,900 \
            about:blank > "$RUNNER_TEMP/hm-chrome.log" 2>&1 &

          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT

          # Wait for local Chrome readiness, without sending requests to H&M.
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import urlopen

          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with urlopen("http://127.0.0.1:9222/json/version", timeout=1) as response:
                      details = json.load(response)
                  if details.get("webSocketDebuggerUrl"):
                      print("Chrome is ready.", flush=True)
                      break
              except (OSError, URLError, ValueError):
                  pass
              time.sleep(1)
          else:
              log = Path(os.environ["RUNNER_TEMP"]) / "hm-chrome.log"
              if log.exists():
                  print(log.read_text(errors="replace")[-6000:])
              raise SystemExit("Chrome did not become ready within 30 seconds.")
          PY

          # Check once, then stop. GitHub schedules the next round.
          # The monitor stops the batch if H&M returns HTTP 403 or 429.
          python monitor.py --connect-chrome --once --state "$RUNNER_TEMP/hm-state/state.json"
          BASH

      - name: Save notification history
        if: ${{ always() && steps.state.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/hm-state"

          # Validate before saving. Never commit credentials, profiles or lock files.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "hm-state" / "state.json"
          state = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(state, dict) or not isinstance(state.get("watches"), dict):
              raise SystemExit("Refusing to save an invalid state file.")
          PY
          git -C "$state_dir" add -- state.json
          if git -C "$state_dir" diff --cached --quiet; then
            echo "Notification history is unchanged."
            exit 0
          fi

          git -C "$state_dir" commit -m "Update H&M notification history"
          state_commit=$(git -C "$state_dir" rev-parse HEAD)

          # Keep retry pauses and sent-alert history even when a stock check failed.
          # A push rejection is reported as a failure; history is never force-pushed.
          for attempt in 1 2 3; do
            if git push origin "$state_commit:refs/heads/monitor-state"; then
              echo "Notification history saved for the next run."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done
          echo "::error::Could not save notification history. Review this failed run; alerts may repeat until saving is fixed."
          exit 1
